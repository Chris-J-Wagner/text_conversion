[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text-conversion"
version = "0.1.0"
description = "Utilities for converting documents (PDF/TXT/DOCX) into sentence corpora."
requires-python = ">=3.11"

# Runtime dependencies of the command-line tools.
#   pypdf      -> PDF text extraction (extract-sentences)
#   matplotlib -> sentence-length histograms (extract-sentences, validate-corpus)
#   phonemizer -> phoneme column (convert-to-altavo-csv; needs an espeak backend installed)
dependencies = [
  "matplotlib>=3.7",
  "pypdf>=4.0.0",
  "phonemizer>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "numpy>=1.24",
  "python-docx>=0.8.11",
]

# Console commands installed by `uv tool install` / `pip install`.
[project.scripts]
extract-sentences = "text_conversion.extract_sentences:main"
validate-corpus = "text_conversion.validate_corpus:main"
convert-to-altavo-csv = "text_conversion.convert_to_altavo_csv:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]

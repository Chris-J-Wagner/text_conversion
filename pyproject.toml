[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "altavo-corpus"
version = "0.1.0"
description = "Convert documents (PDF/TXT/DOCX) into sentence corpora and Altavo CSVs."
requires-python = ">=3.11"

# Runtime dependencies of the command-line tool.
#   pypdf      -> PDF text extraction (extract)
#   matplotlib -> sentence-length histograms (extract, validate)
#   phonemizer -> phoneme column (convert; needs an espeak backend installed)
dependencies = [
  "matplotlib>=3.7",
  "pypdf>=4.0.0",
  "phonemizer>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "numpy>=1.24",
  "python-docx>=0.8.11",
]

# Single command installed by `uv tool install` / `pip install`.
# Subcommands: altavo-corpus {extract,validate,convert}
[project.scripts]
altavo-corpus = "altavo_corpus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
